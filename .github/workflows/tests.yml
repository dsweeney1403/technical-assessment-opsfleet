# Unit tests on every push (D5.12, D8.1). No secrets: every test is mocked, and live tests are skipped.
# Production builds and gates releases in Cloud Build (D6.15, D6.16); this workflow holds no credentials.
name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]   # Windows too, since reviewers may run it there
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Unit tests, including the slow subprocess check
        run: pytest -m "not live" --junitxml=junit.xml
      - name: Show failing tests as annotations
        if: failure()
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          for case in ET.parse("junit.xml").iter("testcase"):
              for bad in list(case.iter("failure")) + list(case.iter("error")):
                  text = (bad.get("message") or "") + " | " + (bad.text or "")[-600:]
                  text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                  print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
