[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analyst"
version = "0.1.0"
description = "OpsFleet Analyst: a data analysis chat agent for retail executives"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:google.genai.*"]

[tool.setuptools.package-data]
analyst = ["sql/*.sql"]
