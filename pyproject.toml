[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analyst"
version = "0.1.0"
description = "OpsFleet Analyst: a data analysis chat agent for retail executives"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:google.genai.*"]
markers = [
    "live: needs real BigQuery and Gemini credentials; run with pytest -m live",
    "slow: starts a subprocess; skipped locally, run in CI and the final check with pytest -m slow",
]
addopts = "-m 'not live and not slow'"

[tool.setuptools.package-data]
analyst = ["sql/*.sql"]
