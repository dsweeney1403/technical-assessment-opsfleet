id: t14
author: Brand analytics, Calvin Klein desk
written: 2026-04-06
question: Which Calvin Klein categories have the best and worst margins?
sql: |
  SELECT p.category,
         ROUND(SUM(oi.sale_price), 2) AS revenue,
         SAFE_DIVIDE(SUM(oi.sale_price - p.cost), SUM(oi.sale_price)) AS margin
  FROM `bigquery-public-data.thelook_ecommerce.order_items` oi
  JOIN `bigquery-public-data.thelook_ecommerce.products` p ON p.id = oi.product_id
  WHERE p.brand = 'Calvin Klein' AND oi.status NOT IN ('Cancelled', 'Returned')
  GROUP BY 1 ORDER BY margin DESC
report: |
  Calvin Klein margins range from 58% in Underwear to 44% in Outerwear & Coats.
  The three largest categories by revenue (Jeans, Tops & Tees, Sweaters) all sit between 48% and 52%.
  Outerwear & Coats is the weak spot: 12% of Calvin Klein revenue at the lowest margin.
  Recommendation: review Calvin Klein outerwear costs with the supplier before the autumn buy.
